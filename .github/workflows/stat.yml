</head>
<body>
    <div class="container">
        <!-- Demographics Section -->
        <section id="demographics" class="section active">
            <h1>Welcome to BaoHope Emotional Well-being Assessment</h1>
            <p>Please provide some information about yourself to help us better understand your context.</p>
            
            <form id="demographics-form" class="demographics-form">
                <div class="form-group">
                    <label for="age">Age Range:</label>
                    <select id="age" required>
                        <option value="">Select age range</option>
                        <option value="18-24">18-24 years</option>
                        <option value="25-34">25-34 years</option>
                        <option value="35-44">35-44 years</option>
                        <option value="45-54">45-54 years</option>
                        <option value="55-64">55-64 years</option>
                        <option value="65+">65 years or older</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="">Select gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="prefer-not">Prefer not to say</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="education">Education Level:</label>
                    <select id="education" required>
                        <option value="">Select education level</option>
                        <option value="primary">Primary Education</option>
                        <option value="secondary">Secondary Education</option>
                        <option value="tertiary">Tertiary Education</option>
                        <option value="vocational">Vocational Training</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Community:</label>
                    <select id="location" required>
                        <option value="">Select your community</option>
                        <option value="Zogbeli">Zogbeli</option>
                        <option value="Dungu">Dungu</option>
                        <option value="Asawaaba">Asawaaba</option>
                        <option value="Kukoo">Kukoo</option>
                    </select>
                </div>

                <button type="submit" class="btn">Continue to Assessment</button>
            </form>
        </section>

        <!-- Introduction Section -->
        <section id="intro" class="section">
            <h1>Emotional Well-being Assessment</h1>
            <p>This assessment is designed to help you understand your emotional well-being. Your responses will be kept confidential and will help us provide personalized suggestions for your journey.</p>
            <p>The assessment takes about 10-15 minutes to complete.</p>
            <button class="btn" onclick="startAssessment()">Start Assessment</button>
            <div class="disclaimer">
                <p><strong>Important:</strong> This assessment is not a substitute for professional medical advice. If you're experiencing severe emotional distress, please seek help from a qualified healthcare provider.</p>
            </div>
        </section>

        <!-- Assessment Section -->
        <section id="assessment" class="section">
            <h2>Emotional Well-being Assessment</h2>
            <div id="question-container"></div>
            <div class="button-group" style="display: flex; gap: 1rem; justify-content: center;">
                <button class="btn" onclick="submitAssessment()" id="submit-btn" style="display: none;">Submit Assessment</button>
                <button class="btn" onclick="retakeAssessment()" id="retake-btn" style="display: none; background-color: #34495e;">Retake Assessment</button>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results" class="section">
            <h2>Your Results</h2>
            <div id="score-container"></div>
            <div id="suggestions-container"></div>
            <div class="results-actions">
                <button class="btn primary-btn" onclick="retakeAssessment()">Retake Assessment</button>
                <button class="btn secondary-btn" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSet30bwWx57GW9tsjScrY2GEWAYp22laVvArhETx50WP1TNQw/viewform?usp=pp_url&', '_blank')">Provide Feedback</button>
                <div class="social-links">
                    <a href="https://wa.me/233246746747" class="social-link">Connect to an expert on WhatsApp</a>
                    <a href="https://www.linkedin.com/company/baohope/" class="social-link">Follow us on LinkedIn</a>
                </div>
            </div>
        </section>
    </div>

