        }

        .suggestions li:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .button-group {
        margin-top: 2rem;
    }

    .button-group .btn {
        min-width: 150px;
    }

    #retake-btn:hover {
        background-color: #2c3e50;
    }

        @media (max-width: 768px) {
