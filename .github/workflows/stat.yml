                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                education: document.getElementById('education').value,
                location: document.getElementById('location').value
            };

            assessmentData = { ...demographicsData };
            
            document.getElementById('demographics').classList.remove('active');
            document.getElementById('intro').classList.add('active');
        });

        function startAssessment() {
            document.getElementById('intro').classList.remove('active');
            document.getElementById('assessment').classList.add('active');
            displayQuestion();
        }

        function displayQuestion() {
        const container = document.getElementById('question-container');
        const question = questions[currentQuestion];
        const progress = ((currentQuestion + 1) / questions.length) * 100;
        
        const html = `
            <div class="progress-bar">
                <div class="progress" style="width: ${progress}%"></div>
            </div>
            <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
            <div class="question-container">
                <h3>${question.text}</h3>
                <div class="options">
                    ${question.options.map((option, index) => `
                        <div class="option" onclick="selectOption(${index}, ${option.value})">
                            ${option.text}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        
        container.innerHTML = html;
            
            if (currentQuestion === questions.length - 1) {
                document.getElementById('submit-btn').style.display = 'block';
            }
        }

        function selectOption(optionIndex, value) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[optionIndex].classList.add('selected');
            
            answers[currentQuestion] = value;
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                setTimeout(displayQuestion, 500);
            }
        }

        function calculateScore() {
            return answers.reduce((sum, score) => sum + score, 0);
        }

        function getSeverityLevel(score) {
            for (const level in suggestions) {
                const range = suggestions[level].range;
                if (score >= range[0] && score <= range[1]) {
                    return level;
                }
            }
        }

        function submitAssessment() {
    const score = calculateScore();
    const severityLevel = getSeverityLevel(score);
    const result = suggestions[severityLevel];

    // Create the results HTML with proper structure
    const resultsHtml = `
        <h2>Your Results</h2>
        <div class="score-result">
            <h3>Your Emotional Wellness Score</h3>
            <h4>${score}/63</h4>
            <p class="severity-level">${result.title}</p>
        </div>
        
        <div class="explanation">
            <p>${result.explanation}</p>
        </div>
        
        <div class="suggestions">
            <h3>Personalized Suggestions</h3>
            <ul>
                ${result.tips.map(tip => `
                    <li>${tip}</li>
                `).join('')}
            </ul>
        </div>

        <div class="results-actions">
            <button class="btn primary-btn" onclick="retakeAssessment()">Retake Assessment</button>
            <button class="btn secondary-btn" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSet30bwWx57GW9tsjScrY2GEWAYp22laVvArhETx50WP1TNQw/viewform?usp=pp_url&', '_blank')">Provide Feedback</button>
            
            <div class="social-links">
                <a href="https://wa.me/233246746747" class="social-link">Connect to BaoHope Foundation expert on WhatsApp</a>
                <a href="https://www.linkedin.com/company/baohope/" class="social-link">Follow our community on LinkedIn</a>
            </div>
        </div>
    `;

    const scoreHtml = `
            <div class="score-result">
                <h3>Your Score: ${score}</h3>
                <h4>${result.title}</h4>
            </div>
            <div class="explanation">
                <p>${result.explanation}</p>
            </div>
        `;
        
        const suggestionsHtml = `
            <div class="suggestions">
                <h3>Personalized Suggestions:</h3>
                <ul>
                    ${result.tips.map(tip => `<li>${tip}</li>`).join('')}
                </ul>
            </div>
        `;

    // Update the results section
    document.getElementById('results').innerHTML = resultsHtml;
    
    // Switch to results section
    document.getElementById('assessment').classList.remove('active');
    document.getElementById('results').classList.add('active');
}


        // Update retakeAssessment function
        function retakeAssessment() {
    // Reset variables
    currentQuestion = 0;
    answers = [];
    
    // Hide results and show demographics
    document.getElementById('results').classList.remove('active');
    document.getElementById('demographics').classList.add('active');
    
    // Reset form fields
    document.getElementById('demographics-form').reset();
    
    // Reset buttons
    document.getElementById('submit-btn').style.display = 'none';
    
    // Clear the question container
    document.getElementById('question-container').innerHTML = '';
}
    </script>
</body>
</html>
